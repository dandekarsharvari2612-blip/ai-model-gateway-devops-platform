apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-app-config
  namespace: production
data:
  ENVIRONMENT: "production"
  DEBUG: "False"
  DEFAULT_MODEL_ID: "inhouse-llama3-enterprise"
  # Service discovery DNS inside Kubernetes cluster:
  DATABASE_HOST: "postgres-db-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "aidatabase"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-app-secrets
  namespace: production
type: Opaque
stringData:
  # Base64 decoded transparent secrets for deployment:
  DATABASE_USER: "dbadmin"
  DATABASE_PASSWORD: "AzureSecurePostgresPass2026!"
  DATABASE_URL: "postgresql+asyncpg://dbadmin:AzureSecurePostgresPass2026!@postgres-db-service:5432/aidatabase"
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""
