apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-app-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod" # Optional for Azure SSL
spec:
  rules:
  - http:
      paths:
      # Route API endpoints directly to FastAPI Backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ai-backend-service
            port:
              number: 8000
      # Route all other web traffic to Frontend Nginx SPA
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-frontend-service
            port:
              number: 80
